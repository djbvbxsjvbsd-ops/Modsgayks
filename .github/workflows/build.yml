name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest  # ou ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload do executável
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
